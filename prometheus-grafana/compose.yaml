services:

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - type: volume
        source: prom-data
        target: /prometheus
      - type: bind
        source: ./prom-conf/
        target: /etc/prometheus/
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana-enterprise
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    
volumes:
  prom-data:
    name: prom-data
  
  grafana-data:
    name: grafana-data
