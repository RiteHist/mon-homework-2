services:
  node_exporter:
    image: prom/node-exporter:v1.10.1
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--web.config.file=/etc/web-conf.yml"
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "./web-conf/web-conf.yml:/etc/web-conf.yml:ro"